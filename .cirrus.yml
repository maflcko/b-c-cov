container:
  image: ubuntu:devel
  cpu: 2
  memory: 8G
timeout_in: 120m
env:
  NUM_MAKE: "4"
  TEST_RUNNER_PORT_MIN: "14000"  # Must be larger than 12321, which is used for the http cache. See https://cirrus-ci.org/guide/writing-tasks/#http-cache
  LC_ALL: "C.UTF-8"
  ID_SSH: "ENCRYPTED[9a36bf88d0eaa01f30b135f3a93c3026f8e43b7e13db016ff274927af64fe51ab4edf6f25c19265a2efc726fed1230ec]"
global_task_template: &GLOBAL_TASK_TEMPLATE
  install_packages_script:
    - apt update && apt install -y git python3-zmq libevent-dev libboost-dev libsqlite3-dev libcapnp-dev capnproto libzmq3-dev lcov build-essential cmake pkg-config curl openssh-client ca-certificates
  prepare_ssh_git_script:
    - mkdir -p ~/.ssh
    - ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
    - echo "$ID_SSH" > ~/.ssh/id_ssh
    - chmod 600 ~/.ssh/id_ssh
    - eval `ssh-agent -s`
    - ssh-add ~/.ssh/id_ssh
    - git config user.name "CI/${CIRRUS_REPO_FULL_NAME}"
    - git config user.email "ci@none.org"
    - git remote add origin_git git@github.com:${CIRRUS_REPO_FULL_NAME}.git  # Add remote so we can push there
    - git fetch origin_git
  prepare_bc_script:
    - git clone --depth=1 https://github.com/bitcoin/bitcoin bitcoin-core
    - cd bitcoin-core
    - sed -i '/list(APPEND LCOV_FILTER_COMMAND -p "src/d' cmake/script/CoverageInclude.cmake.in
    - git diff
    - export MASTER_COMMIT=$(git log --format='%H' -1)

task:
  name: "lcov"
  depends_on:
    - fuzz_cov
  << : *GLOBAL_TASK_TEMPLATE
  build_script:
    - cd bitcoin-core
    - sed -i 's|functional/test_runner.py|functional/test_runner.py --previous-releases --timeout-factor=10 --exclude=feature_dbcrash|g' ./cmake/script/Coverage.cmake
    - ./test/get_previous_releases.py --target-dir ./bld-cov/releases
    #- make -C ./depends NO_BOOST=1 NO_LIBEVENT=1 NO_QT=1 NO_SQLITE=1 NO_ZMQ=1 NO_USDT=1
    #- export BDB_PREFIX="$PWD/./depends/x86_64-pc-linux-gnu"
    #- -DBerkeleyDB_INCLUDE_DIR:PATH="${BDB_PREFIX}/include" -DWITH_BDB=ON
    - cmake -B ./bld-cov -DCMAKE_C_COMPILER='gcc;-fprofile-update=atomic' -DCMAKE_CXX_COMPILER='g++;-fprofile-update=atomic' -DCMAKE_BUILD_TYPE=Coverage --preset=dev-mode -DWITH_QRENCODE=OFF -DBUILD_GUI_TESTS=OFF -DBUILD_GUI=OFF -DWITH_USDT=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_BENCH=OFF
    - cmake --build ./bld-cov -j $NUM_MAKE
    - cmake -DJOBS=$NUM_MAKE -DEXTENDED_FUNCTIONAL_TESTS=ON -DLCOV_OPTS='--rc branch_coverage=1 --ignore-errors mismatch,mismatch,inconsistent,inconsistent' -P ./bld-cov/Coverage.cmake
  upload_script:
    - git checkout site
    - export OTHER_COV_COMMIT=$(git log -1 --grep="fuzz_cov results" --format=%H)
    - git reset --hard origin_git/site_init
    - git cherry-pick $OTHER_COV_COMMIT --allow-empty
    - chown -R $(id -u):$(id -g) ./bitcoin-core/bld-cov/
    - cp -r ./bitcoin-core/bld-cov/*coverage ./
    - git add ./*coverage* && git commit -m "lcov results for upstream@${MASTER_COMMIT}"
    - eval `ssh-agent -s`
    - ssh-add ~/.ssh/id_ssh
    - git push origin_git site -f


task:
  name: "fuzz_cov"
  << : *GLOBAL_TASK_TEMPLATE
  build_script:
    - cd bitcoin-core
    - git clone https://github.com/bitcoin-core/qa-assets --depth=1
    - cmake -B ./bld-fuzz -DBUILD_FOR_FUZZING=ON -DAPPEND_CXXFLAGS='-fprofile-update=atomic' -DAPPEND_CFLAGS='-fprofile-update=atomic' -DCMAKE_BUILD_TYPE=Coverage
    - cmake --build ./bld-fuzz -j $NUM_MAKE
    - cmake -DJOBS=$NUM_MAKE -DFUZZ_CORPORA_DIR=$PWD/qa-assets/fuzz_corpora -DLCOV_OPTS='--rc branch_coverage=1 --ignore-errors mismatch,mismatch,inconsistent,inconsistent' -P ./bld-fuzz/CoverageFuzz.cmake
  upload_script:
    - git checkout site
    - export OTHER_COV_COMMIT=$(git log -1 --grep="lcov results" --format=%H)
    - git reset --hard origin_git/site_init
    - git cherry-pick $OTHER_COV_COMMIT --allow-empty
    - chown -R $(id -u):$(id -g) ./bitcoin-core/bld-fuzz/
    - cp -r ./bitcoin-core/bld-fuzz/*coverage ./
    - git add ./*coverage* && git commit -m "fuzz_cov results for upstream@${MASTER_COMMIT}"
    - eval `ssh-agent -s`
    - ssh-add ~/.ssh/id_ssh
    - git push origin_git site -f
