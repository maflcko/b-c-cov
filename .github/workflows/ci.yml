name: Coverage

on:
  push  # No pull requests allowed, due to secrets

jobs:
  lcov:
    name: lcov
    needs: fuzz_cov  # Can only run sequential, to avoid git push conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ubuntu:devel
    steps:
      - &install_packages
        name: Install packages
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git python3 python3-zmq libevent-dev libboost-dev libsqlite3-dev libcapnp-dev capnproto libzmq3-dev lcov build-essential cmake pkg-config curl openssh-client ca-certificates

      - &prepare_ssh_git
        name: Prepare SSH and git
        env:
          ID_SSH: ${{ secrets.ID_SSH }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$ID_SSH" > ~/.ssh/id_ssh
          chmod 600 ~/.ssh/id_ssh
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ssh
          git clone --origin=origin_git --branch=site "git@github.com:${GITHUB_REPOSITORY}.git" ./cov_repo
          cd ./cov_repo
          git config user.name "CI/${GITHUB_REPOSITORY}"
          git config user.email "ci@none.org"
          git fetch origin_git

      - &prepare_bitcoin_core
        name: Prepare bitcoin-core
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/bitcoin/bitcoin bitcoin-core
          cd bitcoin-core
          sed -i '/list(APPEND LCOV_FILTER_COMMAND -p "src/d' cmake/script/CoverageInclude.cmake.in
          git diff
          printf 'MASTER_COMMIT=%s\n' "$(git log --format='%H' -1)" >> "$GITHUB_ENV"

      - name: Build lcov
        run: |
          set -euxo pipefail
          cd bitcoin-core
          sed -i 's|functional/test_runner.py|functional/test_runner.py --previous-releases --timeout-factor=10 --exclude=feature_dbcrash|g' ./cmake/script/Coverage.cmake
          ./test/get_previous_releases.py --target-dir ./bld-cov/releases
          cmake -B ./bld-cov -DCMAKE_C_COMPILER='gcc;-fprofile-update=atomic' -DCMAKE_CXX_COMPILER='g++;-fprofile-update=atomic' -DCMAKE_BUILD_TYPE=Coverage --preset=dev-mode -DWITH_QRENCODE=OFF -DBUILD_GUI_TESTS=OFF -DBUILD_GUI=OFF -DWITH_USDT=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_BENCH=OFF
          cmake --build ./bld-cov -j "$( nproc )"
          cmake -DJOBS="$(( $( nproc ) * 2 ))" -DEXTENDED_FUNCTIONAL_TESTS=ON -DLCOV_OPTS='--rc branch_coverage=1 --ignore-errors mismatch,mismatch,inconsistent,inconsistent' -P ./bld-cov/Coverage.cmake

      - name: Upload lcov
        run: |
          set -euxo pipefail
          cd ./cov_repo
          export OTHER_COV_COMMIT="$(git log -1 --grep='fuzz_cov results' --format=%H)"
          git reset --hard origin_git/site_init
          git cherry-pick "$OTHER_COV_COMMIT" --allow-empty
          chown -R "$(id -u):$(id -g)" ../bitcoin-core/bld-cov/
          cp -r ../bitcoin-core/bld-cov/*coverage ./
          git add ./*coverage* && git commit -m "lcov results for upstream@${MASTER_COMMIT}"
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ssh
          git push origin_git site -f

  fuzz_cov:
    name: fuzz_cov
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ubuntu:devel
      options: --cpus 2 --memory 8g
    steps:
      - *install_packages
      - *prepare_ssh_git
      - *prepare_bitcoin_core

      - name: Build fuzz coverage
        run: |
          set -euxo pipefail
          cd bitcoin-core
          git clone https://github.com/bitcoin-core/qa-assets --depth=1
          cmake -B ./bld-fuzz -DBUILD_FOR_FUZZING=ON -DAPPEND_CXXFLAGS='-fprofile-update=atomic' -DAPPEND_CFLAGS='-fprofile-update=atomic' -DCMAKE_BUILD_TYPE=Coverage
          cmake --build ./bld-fuzz -j "$( nproc )"
          cmake -DJOBS="$(( $( nproc ) * 2 ))" -DFUZZ_CORPORA_DIR="$PWD/qa-assets/fuzz_corpora" -DLCOV_OPTS='--rc branch_coverage=1 --ignore-errors mismatch,mismatch,inconsistent,inconsistent' -P ./bld-fuzz/CoverageFuzz.cmake

      - name: Upload fuzz coverage
        run: |
          set -euxo pipefail
          cd ./cov_repo
          export OTHER_COV_COMMIT="$(git log -1 --grep='lcov results' --format=%H)"
          git reset --hard origin_git/site_init
          git cherry-pick "$OTHER_COV_COMMIT" --allow-empty
          chown -R "$(id -u):$(id -g)" ../bitcoin-core/bld-fuzz/
          cp -r ../bitcoin-core/bld-fuzz/*coverage ./
          git add ./*coverage* && git commit -m "fuzz_cov results for upstream@${MASTER_COMMIT}"
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ssh
          git push origin_git site -f
